name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Número de versión release (ej: 1.0.1) - SIN SNAPSHOT'
        required: true
        type: string
      release_notes:
        description: 'Notas de la release (opcional). Si se vacía, se generan automáticamente'
        required: false
        type: string
        default: ''
      resume:
        description: 'Reanudar una release cuyo tag ya existe (tras un fallo al publicar): no crea commit ni tag'
        required: false
        type: boolean
        default: false
      publish_docker:
        description: 'Publicar la imagen Docker (desmarcar al reanudar si ya se publicó)'
        required: false
        type: boolean
        default: true

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: La versión debe tener formato X.Y.Z (ej: 1.0.1)"
            exit 1
          fi
          if [[ "$VERSION" == *"SNAPSHOT"* ]]; then
            echo "ERROR: La versión no puede contener SNAPSHOT"
            exit 1
          fi
          echo "Version validada: $VERSION"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag
        env:
          RESUME: ${{ inputs.resume }}
        run: |
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            if [[ "$RESUME" != "true" ]]; then
              echo "ERROR: El tag v${{ inputs.version }} ya existe"
              exit 1
            fi
          elif [[ "$RESUME" == "true" ]]; then
            echo "ERROR: Para reanudar, el tag v${{ inputs.version }} debe existir"
            exit 1
          fi

  update-version:
    name: Update POM versions
    needs: validate
    if: ${{ !inputs.resume }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Update version in all POMs
        run: |
          mvn versions:set -DnewVersion=${{ inputs.version }} -DgenerateBackupPoms=false
          mvn versions:commit

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin main --tags

  build-and-test:
    name: Build and test
    needs: [validate, update-version]
    # update-version is skipped when resuming; any other result stops the release
    if: ${{ !cancelled() && needs.validate.result == 'success' && (needs.update-version.result == 'success' || needs.update-version.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn clean verify -B

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/surefire-reports/'
          retention-days: 7

  publish-maven:
    name: Publish to Maven Central
    needs: build-and-test
    if: ${{ !cancelled() && needs.build-and-test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Maven 3.10, now on the GitHub runners, leaves resolver files (maven-metadata-local.xml)
      # in the bundle of central-publishing-maven-plugin 0.11 and Central rejects it: "Bundle
      # has content that does NOT have a .pom file". 3.9.11 builds a valid bundle.
      - name: Set up Maven 3.9.11
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maven.tar.gz" \
            https://repo1.maven.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.tar.gz
          echo "bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978  $RUNNER_TEMP/maven.tar.gz" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.11/bin" >> "$GITHUB_PATH"

      - name: Publish to Maven Central
        run: mvn -P release --batch-mode deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  publish-docker:
    name: Publish Docker image
    needs: build-and-test
    if: ${{ !cancelled() && needs.build-and-test.result == 'success' && inputs.publish_docker }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          maven-version: '3.9.6'

      - name: Build JAR
        run: mvn clean package -DskipTests -pl prompt-shield-api-proxy -am

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ploybot/prompt-shield-api-proxy
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: prompt-shield-api-proxy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    name: Create GitHub Release
    needs: [publish-maven, publish-docker]
    if: ${{ !cancelled() && needs.publish-maven.result == 'success' && (needs.publish-docker.result == 'success' || needs.publish-docker.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Package JARs
        run: mvn package -B -DskipTests

      - name: Create release body file
        # Passed through the environment: interpolating the input into the script would
        # break on quotes and run anything written in the notes
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: printf '%s\n' "$RELEASE_NOTES" > /tmp/release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: Release v${{ inputs.version }}
          body_path: /tmp/release-body.md
          generate_release_notes: ${{ inputs.release_notes == '' }}
          files: |
            prompt-shield-core/target/*.jar
            prompt-shield-spring-boot-starter/target/*.jar
            prompt-shield-spring-ai-advisor/target/*.jar
            prompt-shield-storage-jpa/target/*.jar
            prompt-shield-storage-redis/target/*.jar
            prompt-shield-ner-opennlp/target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bump-snapshot:
    name: Bump to next SNAPSHOT
    needs: github-release
    if: ${{ !cancelled() && needs.github-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Bump to next SNAPSHOT
        run: |
          CURRENT="${{ inputs.version }}"
          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          NEXT_MINOR=$((MINOR + 1))
          NEXT_VERSION="${MAJOR}.${NEXT_MINOR}.0-SNAPSHOT"
          echo "Bumping to $NEXT_VERSION"
          mvn versions:set -DnewVersion=$NEXT_VERSION -DgenerateBackupPoms=false
          mvn versions:commit

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: bump to next SNAPSHOT version" || echo "No changes to commit"
          git push origin main
